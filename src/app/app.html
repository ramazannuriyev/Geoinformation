<tui-root tuiTheme="light">
  <div class="app-shell">
    <div class="header-row">
      <h1 class="logo">{{ 'nav.header' | translate: languageService.current() }}</h1>
      <div class="lang-toggle">
        <label>
          <input
            type="radio"
            name="lang"
            [checked]="languageService.current() === 'ru'"
            (change)="languageService.setLanguage('ru')"
          />
          RU
        </label>
        <label>
          <input
            type="radio"
            name="lang"
            [checked]="languageService.current() === 'en'"
            (change)="languageService.setLanguage('en')"
          />
          EN
        </label>
      </div>
    </div>

    <nav class="tabs">
      <a routerLink="/countries" routerLinkActive="active">{{
        'nav.countries' | translate: languageService.current()
      }}</a>
      <a routerLink="/cities" routerLinkActive="active">{{
        'nav.cities' | translate: languageService.current()
      }}</a>
    </nav>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </div>
</tui-root>
